<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <style>
    :root {
      --bjmp-blue: #12365d;
      --bjmp-gold: #f2c94c;
      --panel-border: #d9e1ea;
      --text: #1f2937;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: #f3f6fa;
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .shell {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: var(--bjmp-blue);
      color: #fff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 4px solid var(--bjmp-gold);
    }

    .agency {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .subtitle {
      opacity: .82;
      font-size: 13px;
      margin-top: 2px;
    }

    .legend {
      display: flex;
      gap: 16px;
      font-size: 13px;
      align-items: center;
      flex-wrap: wrap;
    }

    .legend-item {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      white-space: nowrap;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    #calendar {
      flex: 1;
      padding: 22px;
    }

    .fc {
      background: #fff;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 18px;
      min-height: calc(100vh - 112px);
      box-shadow: 0 10px 28px rgba(15, 35, 60, .08);
    }

    .fc .fc-toolbar-title {
      color: var(--bjmp-blue);
      font-size: 27px;
      font-weight: 700;
    }

    .fc .fc-button-primary {
      background: var(--bjmp-blue);
      border-color: var(--bjmp-blue);
      border-radius: 5px;
      text-transform: capitalize;
      box-shadow: none;
    }

    .fc .fc-daygrid-day-number {
      color: #344052;
      font-weight: 600;
      padding: 8px;
    }

    .fc .fc-col-header-cell {
      background: #eef3f8;
      color: var(--bjmp-blue);
      padding: 8px 0;
      font-weight: 700;
    }

    .fc-event {
      border: 0;
      border-radius: 5px;
      padding: 3px 5px;
      font-weight: 600;
      cursor: grab;
      box-shadow: 0 2px 5px rgba(0, 0, 0, .12);
    }

    .fc-event:active {
      cursor: grabbing;
    }

    .fc-daygrid-day:hover {
      background: #f8fbff;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="agency">BJMP Hearing Scheduling Dashboard</div>
        <div class="subtitle">Excel-backed calendar management</div>
      </div>

    </header>
    <main id="calendar"></main>
  </div>

  <script>
    let calendar;

    function post(message) {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(message);
      }
    }

    window.renderHearings = function(events) {
      calendar.removeAllEvents();
      calendar.addEventSource(events);
    };

    document.addEventListener('DOMContentLoaded', function() {
      calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: 'dayGridMonth',
        height: '100%',
        expandRows: true,
        editable: true,
        selectable: true,
        dayMaxEvents: true,
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,listMonth'
        },
        dateClick: function(info) {
          post({ action: 'dateview', date: info.dateStr });
        },
        eventClick: function(info) {
          post({ action: 'select', id: info.event.id });
        },
        eventDrop: function(info) {
          post({ action: 'move', id: info.event.id, date: info.event.startStr.substring(0, 10) });
        }
      });

      calendar.render();
      post({ action: 'ready' });
    });
  </script>
</body>
</html>
